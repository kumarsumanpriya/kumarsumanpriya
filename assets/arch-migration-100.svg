        <text x="8" y="18" class="sans" font-size="10.5" font-weight="700" fill="#E2E8F0">Autonomous Remediation Swarm</text>
        <text x="8" y="34" class="mono" font-size="9.5" fill="#94A3B8">LangGraph &amp; CrewAI Auto-Healing</text>
      </g>

      <g transform="translate(10, 216)">
        <rect width="225" height="52" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
        <text x="8" y="18" class="sans" font-size="10.5" font-weight="700" fill="#10B981">LLMOps &amp; AI Guardrails</text>
        <text x="8" y="34" class="mono" font-size="9.5" fill="#94A3B8">Prompt Defense &amp; Token FinOps</text>
