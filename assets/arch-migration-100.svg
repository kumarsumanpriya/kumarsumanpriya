      <g transform="translate(10, 82)">
        <rect width="225" height="42" rx="4" fill="#1E293B" />
        <text x="8" y="16" class="sans" font-size="10.5" font-weight="700" fill="#E2E8F0">Log Analytics &amp; DCR Rules</text>
        <text x="8" y="30" class="mono" font-size="9.5" fill="#94A3B8">Filtered telemetry saving 35% FinOps</text>
      </g>
    </g>

    <!-- SPOKE 3: AI PLATFORM & AGENTS -->
    <g transform="translate(545, 48)">
