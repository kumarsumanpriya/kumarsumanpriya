<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0A101D" />
    </linearGradient>
    <linearGradient id="tierBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070D19" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="innerCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Lines -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" /><stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
    .header-title { font-size: 16px; font-weight: 800; fill: #F8FAFC; letter-spacing: 1px; }
    .box-title { font-size: 13px; font-weight: 700; fill: #38BDF8; letter-spacing: 0.5px; }
    .item-text { font-size: 11px; fill: #94A3B8; font-weight: 500; }
    .badge-text { font-size: 10px; font-weight: 700; fill: #E2E8F0; }
  </style>

  <!-- Canvas Boundary -->
  <rect width="1200" height="520" rx="16" fill="url(#canvasBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- HEADER BAR -->
  <g transform="translate(30, 25)">
    <rect width="1140" height="42" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <path d="M 12 0 L 1128 0" stroke="url(#cyanLine)" stroke-width="2.5" />
    <text x="20" y="26" class="sans header-title">ENTERPRISE 100+ WORKLOAD CLOUD MIGRATION &amp; CAF LANDING ZONE BLUEPRINT</text>
    <text x="1120" y="26" class="mono badge-text" fill="#10B981" text-anchor="end">STATUS: PRODUCTION CERTIFIED (ZERO-DOWNTIME)</text>
  </g>

  <!-- SECTION 1: ON-PREMISES DATACENTER -->
  <g transform="translate(30, 85)">
    <rect width="250" height="350" rx="12" fill="url(#tierBg)" stroke="#334155" stroke-width="1.2" filter="url(#boxShadow)" />
    <!-- Header -->
    <rect width="250" height="34" rx="12" fill="#1E293B" />
    <text x="20" y="22" class="sans box-title" fill="#F87171">🏢 ON-PREMISES DATACENTER</text>
    
    <!-- Content Items -->
    <g transform="translate(16, 48)">
      <rect width="218" height="60" rx="6" fill="url(#innerCard)" stroke="#334155" stroke-width="0.8" />
      <text x="12" y="22" class="sans" font-size="11.5" font-weight="700" fill="#E2E8F0">100+ Heterogeneous VMs</text>
      <text x="12" y="40" class="mono item-text">RHEL, Windows Server, VMware ESXi</text>
    </g>

    <g transform="translate(16, 120)">
      <rect width="218" height="60" rx="6" fill="url(#innerCard)" stroke="#334155" stroke-width="0.8" />
      <text x="12" y="22" class="sans" font-size="11.5" font-weight="700" fill="#E2E8F0">Enterprise Database Tier</text>
      <text x="12" y="40" class="mono item-text">Oracle RAC, SQL Server Cluster, PG</text>
    </g>

    <g transform="translate(16, 192)">
      <rect width="218" height="60" rx="6" fill="url(#innerCard)" stroke="#334155" stroke-width="0.8" />
      <text x="12" y="22" class="sans" font-size="11.5" font-weight="700" fill="#E2E8F0">Azure Migrate Appliance</text>
      <text x="12" y="40" class="mono item-text">Continuous Discovery &amp; TCO Analysis</text>
    </g>

    <g transform="translate(16, 264)">
