      <text x="12" y="20" class="sans" font-size="11.5" font-weight="700" fill="#FBBF24">Pre-Cutover Readiness</text>
      <text x="12" y="38" class="mono item-text">• Bandwidth sizing &amp; IPAM audit</text>
      <text x="12" y="52" class="mono item-text">• Database replication sync</text>
    </g>
  </g>

  <!-- CONNECTOR PIPELINE: EXPRESSROUTE & VPN -->
  <g transform="translate(290, 190)">
    <line x1="0" y1="50" x2="60" y2="50" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="1.5s" repeatCount="indefinite" />
    </line>
    <rect x="5" y="10" width="50" height="80" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
    <text x="30" y="34" class="mono" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">10 Gbps</text>
    <text x="30" y="52" class="sans" font-size="8.5" font-weight="700" fill="#E2E8F0" text-anchor="middle">Express</text>
    <text x="30" y="65" class="sans" font-size="8.5" font-weight="700" fill="#E2E8F0" text-anchor="middle">Route</text>
    <text x="30" y="82" class="mono" font-size="8" fill="#10B981" text-anchor="middle">IPSec S2S</text>
  </g>

