  <!-- FOOTER: 10 PILLARS TICKER -->
  <g transform="translate(30, 455)">
    <rect width="1140" height="42" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <text x="20" y="26" class="sans" font-size="11.5" font-weight="800" fill="#38BDF8">CORE ARCHITECTURAL PILLARS:</text>
    <text x="235" y="26" class="mono" font-size="11" fill="#E2E8F0">
