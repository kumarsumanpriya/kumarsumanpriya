<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="aksBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0A1226" />
      <stop offset="100%" stop-color="#060A18" />
    </linearGradient>

    <linearGradient id="aksBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="aksCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98" />
    </linearGradient>

    <filter id="aksShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
    .header-text { font-size: 14px; font-weight: 800; fill: #FFFFFF; }
    .card-title { font-size: 13px; font-weight: 700; }
    .bullet { font-size: 11px; fill: #CBD5E1; }
  </style>

  <rect width="1200" height="320" rx="16" fill="url(#aksBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- TOP ROUTING BAR -->
  <g transform="translate(30, 20)">
    <rect width="1140" height="50" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2" filter="url(#aksShadow)" />
    <path d="M 12 0 L 1128 0" stroke="url(#aksBlue)" stroke-width="3" stroke-linecap="round" />
    <text x="30" y="31" class="sans header-text">GLOBAL INGRESS &amp; APPLICATION GATEWAY (WAF v2 / AGIC)</text>
    <text x="1110" y="31" class="mono" font-size="11" fill="#38BDF8" text-anchor="end">AZURE FRONT DOOR • MULTI-AZ ANYCAST VIP</text>
  </g>

  <!-- CONNECTING BUS -->
  <path d="M 315 70 L 315 100" stroke="#38BDF8" stroke-width="2" />
  <path d="M 885 70 L 885 100" stroke="#818CF8" stroke-width="2" />

  <!-- LEFT: SYSTEM NODE POOL -->
  <g transform="translate(30, 100)">
    <rect width="555" height="195" rx="12" fill="url(#aksCard)" stroke="#1E293B" stroke-width="1.2" filter="url(#aksShadow)" />
    <path d="M 12 0 L 543 0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

    <text x="24" y="32" class="sans card-title" fill="#38BDF8">SYSTEM NODE POOL (ZONE 1, 2, 3)</text>
    <text x="24" y="50" class="mono" font-size="10.5" fill="#64748B">CLUSTER CORE SERVICES &amp; SECURITY CONTROLS</text>
    <line x1="24" y1="62" x2="530" y2="62" stroke="#334155" stroke-width="0.8" />

    <circle cx="34" cy="88" r="3.5" fill="#38BDF8" />
    <text x="46" y="92" class="sans bullet">Cilium eBPF Dataplane (Sub-millisecond packet routing, L7 Hubble observability)</text>

    <circle cx="34" cy="118" r="3.5" fill="#38BDF8" />
    <text x="46" y="122" class="sans bullet">CoreDNS with Azure DNS Private Zones auto-registration</text>

    <circle cx="34" cy="148" r="3.5" fill="#38BDF8" />
    <text x="46" y="152" class="sans bullet">Azure Key Vault Secrets Store CSI Driver (Zero credentials stored in Git or on disk)</text>

    <circle cx="34" cy="178" r="3.5" fill="#38BDF8" />
    <text x="46" y="182" class="sans bullet">ArgoCD Declarative GitOps Reconcilers (Continuous automated drift mitigation)</text>
  </g>

  <!-- RIGHT: USER WORKLOAD POOL -->
  <g transform="translate(615, 100)">
    <rect width="555" height="195" rx="12" fill="url(#aksCard)" stroke="#1E293B" stroke-width="1.2" filter="url(#aksShadow)" />
    <path d="M 12 0 L 543 0" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" />

    <text x="24" y="32" class="sans card-title" fill="#818CF8">USER WORKLOAD NODE POOL (ZONE 1, 2, 3)</text>
    <text x="24" y="50" class="mono" font-size="10.5" fill="#64748B">FINANCIAL-GRADE TRANSACTION WORKLOADS</text>
    <line x1="24" y1="62" x2="530" y2="62" stroke="#334155" stroke-width="0.8" />

    <circle cx="34" cy="88" r="3.5" fill="#818CF8" />
    <text x="46" y="92" class="sans bullet">Microsoft Entra Workload Identity (OIDC federated service account tokens)</text>

    <circle cx="34" cy="118" r="3.5" fill="#818CF8" />
    <text x="46" y="122" class="sans bullet">KEDA Event-Driven Autoscalers (Dynamic scale from 6 to 40+ replicas via queues)</text>

    <circle cx="34" cy="148" r="3.5" fill="#818CF8" />
    <text x="46" y="152" class="sans bullet">Pod Anti-Affinity &amp; TopologySpreadConstraints across availability zones</text>

    <circle cx="34" cy="178" r="3.5" fill="#818CF8" />
    <text x="46" y="182" class="sans bullet">Pod Disruption Budgets (minAvailable: 80%) ensuring zero-loss node drains</text>
  </g>
</svg>

