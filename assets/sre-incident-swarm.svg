<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="swarmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070C1E" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="swarmCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98" />
    </linearGradient>

    <filter id="swShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
    .s-title { font-size: 13px; font-weight: 800; }
    .s-sub { font-size: 11px; fill: #94A3B8; }
    .s-badge { font-size: 10px; font-weight: 700; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#swarmBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- STEP 1: TRIGGER NODE -->
  <g transform="translate(30, 40)">
    <rect width="240" height="240" rx="12" fill="url(#swarmCard)" stroke="#1E293B" stroke-width="1.2" filter="url(#swShadow)" />
    <path d="M 10 0 L 230 0" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" />
    
    <rect x="18" y="20" width="80" height="24" rx="12" fill="#7F1D1D" stroke="#EF4444" stroke-width="0.8" />
    <text x="58" y="36" class="mono s-badge" fill="#FCA5A5" text-anchor="middle">TRIGGER</text>

    <text x="18" y="70" class="sans s-title" fill="#F87171">Prometheus / SRE Alert</text>
    <text x="18" y="88" class="mono s-sub">Pod CrashLoopBackOff</text>
    <line x1="18" y1="98" x2="222" y2="98" stroke="#334155" stroke-width="0.8" />

    <text x="18" y="125" class="sans" font-size="11.5" fill="#E2E8F0">• High container restart rate</text>
    <text x="18" y="150" class="sans" font-size="11.5" fill="#E2E8F0">• Webhook dispatches to swarm</text>
    <text x="18" y="175" class="sans" font-size="11.5" fill="#E2E8F0">• Captures pod &amp; namespace ID</text>
    <text x="18" y="200" class="sans" font-size="11.5" fill="#E2E8F0">• Latency to trigger: &lt; 2.5s</text>
  </g>

  <!-- ARROW 1 -->
  <path d="M 270 160 L 310 160" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="290" cy="160" r="4" fill="#38BDF8" />

  <!-- STEP 2: SUPERVISORY AGENT -->
  <g transform="translate(320, 40)">
    <rect width="250" height="240" rx="12" fill="url(#swarmCard)" stroke="#1E293B" stroke-width="1.2" filter="url(#swShadow)" />
    <path d="M 10 0 L 240 0" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" />

    <rect x="18" y="20" width="95" height="24" rx="12" fill="#4C1D95" stroke="#8B5CF6" stroke-width="0.8" />
    <text x="65" y="36" class="mono s-badge" fill="#DDD6FE" text-anchor="middle">SUPERVISOR</text>

    <text x="18" y="70" class="sans s-title" fill="#A78BFA">LangGraph Orchestrator</text>
    <text x="18" y="88" class="mono s-sub">State Machine &amp; Triage</text>
    <line x1="18" y1="98" x2="232" y2="98" stroke="#334155" stroke-width="0.8" />

    <text x="18" y="125" class="sans" font-size="11.5" fill="#E2E8F0">• Evaluates blast radius</text>
    <text x="18" y="150" class="sans" font-size="11.5" fill="#E2E8F0">• Parallelizes agent tasks</text>
    <text x="18" y="175" class="sans" font-size="11.5" fill="#E2E8F0">• Enforces safety guardrails</text>
    <text x="18" y="200" class="sans" font-size="11.5" fill="#E2E8F0">• Manages state transitions</text>
  </g>

  <!-- ARROW 2 -->
  <path d="M 570 160 L 610 160" stroke="#8B5CF6" stroke-width="2" />
  <circle cx="590" cy="160" r="4" fill="#8B5CF6" />

  <!-- STEP 3: WORKER AGENTS (MCP & RAG) -->
  <g transform="translate(620, 40)">
    <rect width="270" height="240" rx="12" fill="url(#swarmCard)" stroke="#1E293B" stroke-width="1.2" filter="url(#swShadow)" />
    <path d="M 10 0 L 260 0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

    <rect x="18" y="20" width="105" height="24" rx="12" fill="#0C4A6E" stroke="#0284C7" stroke-width="0.8" />
    <text x="70" y="36" class="mono s-badge" fill="#7DD3FC" text-anchor="middle">DUAL WORKERS</text>

    <text x="18" y="70" class="sans s-title" fill="#38BDF8">Diagnostic MCP + RAG</text>
    <text x="18" y="88" class="mono s-sub">Tool Calling &amp; Knowledge</text>
    <line x1="18" y1="98" x2="252" y2="98" stroke="#334155" stroke-width="0.8" />

    <text x="18" y="125" class="sans" font-size="11.5" fill="#E2E8F0">• MCP: Live `kubectl` log inspection</text>
    <text x="18" y="150" class="sans" font-size="11.5" fill="#E2E8F0">• MCP: Inspects Terraform state</text>
    <text x="18" y="175" class="sans" font-size="11.5" fill="#E2E8F0">• RAG: Azure AI Search hybrid query</text>
    <text x="18" y="200" class="sans" font-size="11.5" fill="#E2E8F0">• pgvector: Finds verified past fix</text>
  </g>

  <!-- ARROW 3 -->
  <path d="M 890 160 L 930 160" stroke="#34D399" stroke-width="2" />
  <circle cx="910" cy="160" r="4" fill="#34D399" />

  <!-- STEP 4: REMEDIATION & PR BOT -->
  <g transform="translate(940, 40)">
    <rect width="230" height="240" rx="12" fill="url(#swarmCard)" stroke="#1E293B" stroke-width="1.2" filter="url(#swShadow)" />
    <path d="M 10 0 L 220 0" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />

    <rect x="18" y="20" width="95" height="24" rx="12" fill="#064E3B" stroke="#059669" stroke-width="0.8" />
    <text x="65" y="36" class="mono s-badge" fill="#A7F3D0" text-anchor="middle">RESOLUTION</text>

    <text x="18" y="70" class="sans s-title" fill="#34D399">Autonomous PR Bot</text>
    <text x="18" y="88" class="mono s-sub">GitOps Self-Healing</text>
    <line x1="18" y1="98" x2="212" y2="98" stroke="#334155" stroke-width="0.8" />

    <text x="18" y="125" class="sans" font-size="11.5" fill="#E2E8F0">• Generates Helm values patch</text>
    <text x="18" y="150" class="sans" font-size="11.5" fill="#E2E8F0">• Infracost &amp; Checkov pre-scan</text>
    <text x="18" y="175" class="sans" font-size="11.5" fill="#E2E8F0">• Posts PR for engineer sign-off</text>
    <text x="18" y="200" class="sans" font-size="11.5" fill="#E2E8F0">• Slashing MTTR by 85%</text>
  </g>
</svg>

