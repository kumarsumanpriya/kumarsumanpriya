<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="toolsetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#090E1D" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="toolCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070C18" stop-opacity="0.95" />
    </linearGradient>

    <!-- Top Neon Accent Bars -->
    <linearGradient id="accentAzure" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" /><stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="accentGitOps" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF7B4D" /><stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="accentSec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" /><stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" /><stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Pill Background -->
    <linearGradient id="pillFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
    .cat-title { font-size: 13.5px; font-weight: 800; letter-spacing: 0.8px; }
    .tool-text { font-size: 11px; font-weight: 600; fill: #F1F5F9; }
  </style>

  <!-- Canvas -->
  <rect width="1200" height="440" rx="16" fill="url(#toolsetBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- HEADER -->
  <g transform="translate(30, 22)">
    <path d="M 0 0 L 1140 0" stroke="url(#accentAzure)" stroke-width="2.5" />
    <text x="0" y="24" class="sans" font-size="15" font-weight="900" fill="#F8FAFC" letter-spacing="1">
      ⚡ CORE ENGINEERING TOOLSET &amp; PRODUCTION ARSENAL
    </text>
    <text x="1140" y="24" class="mono" font-size="10.5" fill="#38BDF8" text-anchor="end">
      HANDS-ON PRODUCTION PROFICIENCY • VERIFIED IN ENTERPRISE ENVIRONMENTS
    </text>
  </g>

  <!-- 4 COLUMNS / CARDS GRID (2x2 Layout) -->

  <!-- CARD 1: AZURE CLOUD & IAC (Top Left) -->
  <g transform="translate(30, 68)">
    <rect width="555" height="165" rx="12" fill="url(#toolCardBg)" stroke="#1E293B" stroke-width="1.2" filter="url(#softGlow)" />
    <path d="M 12 0 L 543 0" stroke="url(#accentAzure)" stroke-width="2" stroke-linecap="round" />
    <text x="20" y="28" class="sans cat-title" fill="#38BDF8">☁️ MICROSOFT AZURE &amp; INFRASTRUCTURE AS CODE (IaC)</text>

    <!-- Pills Row 1 -->
    <g transform="translate(20, 48)">
      <!-- Microsoft Azure -->
      <g transform="translate(0, 0)">
        <rect width="130" height="30" rx="6" fill="url(#pillFill)" stroke="#0078D4" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#0078D4" />
        <text x="22" y="19" class="sans tool-text">Microsoft Azure</text>
      </g>
      <!-- Terraform -->
      <g transform="translate(140, 0)">
        <rect width="95" height="30" rx="6" fill="url(#pillFill)" stroke="#7B42BC" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#7B42BC" />
        <text x="22" y="19" class="sans tool-text">Terraform</text>
      </g>
      <!-- Bicep -->
      <g transform="translate(245, 0)">
        <rect width="70" height="30" rx="6" fill="url(#pillFill)" stroke="#0078D4" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#0078D4" />
        <text x="22" y="19" class="sans tool-text">Bicep</text>
      </g>
      <!-- ARM Templates -->
      <g transform="translate(325, 0)">
        <rect width="125" height="30" rx="6" fill="url(#pillFill)" stroke="#38BDF8" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#38BDF8" />
        <text x="22" y="19" class="sans tool-text">ARM Templates</text>
      </g>
      <!-- Infracost -->
      <g transform="translate(460, 0)">
        <rect width="80" height="30" rx="6" fill="url(#pillFill)" stroke="#F59E0B" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#F59E0B" />
        <text x="22" y="19" class="sans tool-text">Infracost</text>
      </g>
    </g>

    <!-- Pills Row 2 -->
    <g transform="translate(20, 92)">
      <!-- AKS -->
      <g transform="translate(0, 0)">
        <rect width="65" height="30" rx="6" fill="url(#pillFill)" stroke="#326CE5" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#326CE5" />
        <text x="22" y="19" class="sans tool-text">AKS</text>
      </g>
      <!-- Azure CLI -->
      <g transform="translate(75, 0)">
        <rect width="90" height="30" rx="6" fill="url(#pillFill)" stroke="#0078D4" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#0078D4" />
        <text x="22" y="19" class="sans tool-text">Azure CLI</text>
      </g>
      <!-- Linux -->
      <g transform="translate(175, 0)">
        <rect width="70" height="30" rx="6" fill="url(#pillFill)" stroke="#FCC624" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#FCC624" />
        <text x="22" y="19" class="sans tool-text">Linux</text>
      </g>
      <!-- Python -->
      <g transform="translate(255, 0)">
        <rect width="75" height="30" rx="6" fill="url(#pillFill)" stroke="#3776AB" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#3776AB" />
        <text x="22" y="19" class="sans tool-text">Python</text>
      </g>
      <!-- YAML -->
      <g transform="translate(340, 0)">
        <rect width="70" height="30" rx="6" fill="url(#pillFill)" stroke="#CB171E" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#CB171E" />
        <text x="22" y="19" class="sans tool-text">YAML</text>
      </g>
      <!-- Docker -->
      <g transform="translate(420, 0)">
        <rect width="80" height="30" rx="6" fill="url(#pillFill)" stroke="#2496ED" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#2496ED" />
        <text x="22" y="19" class="sans tool-text">Docker</text>
      </g>
    </g>

    <text x="20" y="148" class="mono" font-size="10" fill="#64748B">
      CAF Landing Zones • Virtual Networks • Microsegmentation • Drift Automation
    </text>
  </g>

  <!-- CARD 2: CI/CD & GITOPS ORCHESTRATION (Top Right) -->
  <g transform="translate(615, 68)">
    <rect width="555" height="165" rx="12" fill="url(#toolCardBg)" stroke="#1E293B" stroke-width="1.2" filter="url(#softGlow)" />
    <path d="M 12 0 L 543 0" stroke="url(#accentGitOps)" stroke-width="2" stroke-linecap="round" />
    <text x="20" y="28" class="sans cat-title" fill="#F59E0B">🚀 CI/CD FACTORY &amp; GITOPS ORCHESTRATION</text>

    <!-- Pills Row 1 -->
    <g transform="translate(20, 48)">
      <!-- Azure DevOps -->
      <g transform="translate(0, 0)">
        <rect width="115" height="30" rx="6" fill="url(#pillFill)" stroke="#0078D7" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#0078D7" />
        <text x="22" y="19" class="sans tool-text">Azure DevOps</text>
      </g>
      <!-- Azure Pipelines -->
      <g transform="translate(125, 0)">
        <rect width="120" height="30" rx="6" fill="url(#pillFill)" stroke="#0078D7" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#0078D7" />
        <text x="22" y="19" class="sans tool-text">Azure Pipelines</text>
      </g>
      <!-- GitHub -->
      <g transform="translate(255, 0)">
        <rect width="75" height="30" rx="6" fill="url(#pillFill)" stroke="#FFFFFF" stroke-width="0.8" />
        <circle cx="12" cy="15" r="4" fill="#FFFFFF" />
        <text x="22" y="19" class="sans tool-text">GitHub</text>
      </g>
      <!-- Git -->
      <g transform="translate(340, 0)">
        <rect width="55" height="30" rx="6" fill="url(#pillFill)" stroke="#F05032" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#F05032" />
        <text x="22" y="19" class="sans tool-text">Git</text>
      </g>
      <!-- CI/CD -->
      <g transform="translate(405, 0)">
        <rect width="70" height="30" rx="6" fill="url(#pillFill)" stroke="#10B981" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#10B981" />
        <text x="22" y="19" class="sans tool-text">CI/CD</text>
      </g>
    </g>

    <!-- Pills Row 2 -->
    <g transform="translate(20, 92)">
      <!-- ArgoCD -->
      <g transform="translate(0, 0)">
        <rect width="80" height="30" rx="6" fill="url(#pillFill)" stroke="#EF7B4D" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#EF7B4D" />
        <text x="22" y="19" class="sans tool-text">ArgoCD</text>
      </g>
      <!-- Helm -->
      <g transform="translate(90, 0)">
        <rect width="65" height="30" rx="6" fill="url(#pillFill)" stroke="#0F1689" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#38BDF8" />
        <text x="22" y="19" class="sans tool-text">Helm</text>
      </g>
      <!-- Prometheus -->
      <g transform="translate(165, 0)">
        <rect width="105" height="30" rx="6" fill="url(#pillFill)" stroke="#E6522C" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#E6522C" />
        <text x="22" y="19" class="sans tool-text">Prometheus</text>
      </g>
      <!-- Grafana -->
      <g transform="translate(280, 0)">
        <rect width="80" height="30" rx="6" fill="url(#pillFill)" stroke="#F46800" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#F46800" />
        <text x="22" y="19" class="sans tool-text">Grafana</text>
      </g>
    </g>

    <text x="20" y="148" class="mono" font-size="10" fill="#64748B">
      Trunk-Based GitOps • Blue/Green Canaries • Multi-Stage Approval Gates
    </text>
  </g>

  <!-- CARD 3: DEVSECOPS, SAST/DAST & CODE QUALITY (Bottom Left) -->
  <g transform="translate(30, 250)">
    <rect width="555" height="165" rx="12" fill="url(#toolCardBg)" stroke="#1E293B" stroke-width="1.2" filter="url(#softGlow)" />
    <path d="M 12 0 L 543 0" stroke="url(#accentSec)" stroke-width="2" stroke-linecap="round" />
    <text x="20" y="28" class="sans cat-title" fill="#10B981">🛡️ DEVSECOPS, SAST / DAST &amp; QUALITY GATES</text>

    <!-- Pills Row 1 -->
    <g transform="translate(20, 48)">
      <!-- SonarQube -->
      <g transform="translate(0, 0)">
        <rect width="105" height="30" rx="6" fill="url(#pillFill)" stroke="#4E9BCD" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#4E9BCD" />
        <text x="22" y="19" class="sans tool-text">SonarQube</text>
      </g>
      <!-- SAST -->
      <g transform="translate(115, 0)">
        <rect width="65" height="30" rx="6" fill="url(#pillFill)" stroke="#10B981" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#10B981" />
        <text x="22" y="19" class="sans tool-text">SAST</text>
      </g>
      <!-- DAST -->
      <g transform="translate(190, 0)">
        <rect width="65" height="30" rx="6" fill="url(#pillFill)" stroke="#38BDF8" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#38BDF8" />
        <text x="22" y="19" class="sans tool-text">DAST</text>
      </g>
      <!-- Checkov -->
      <g transform="translate(265, 0)">
        <rect width="85" height="30" rx="6" fill="url(#pillFill)" stroke="#2496ED" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#2496ED" />
        <text x="22" y="19" class="sans tool-text">Checkov</text>
      </g>
      <!-- GitLeaks -->
      <g transform="translate(360, 0)">
        <rect width="85" height="30" rx="6" fill="url(#pillFill)" stroke="#EF4444" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#EF4444" />
        <text x="22" y="19" class="sans tool-text">GitLeaks</text>
      </g>
      <!-- Trivy -->
      <g transform="translate(455, 0)">
        <rect width="65" height="30" rx="6" fill="url(#pillFill)" stroke="#0052CC" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#0052CC" />
        <text x="22" y="19" class="sans tool-text">Trivy</text>
      </g>
    </g>

    <!-- Pills Row 2 -->
    <g transform="translate(20, 92)">
      <!-- CIS Benchmarks -->
      <g transform="translate(0, 0)">
        <rect width="135" height="30" rx="6" fill="url(#pillFill)" stroke="#818CF8" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#818CF8" />
        <text x="22" y="19" class="sans tool-text">CIS Benchmarks</text>
      </g>
      <!-- PIM / Entra ID -->
      <g transform="translate(145, 0)">
        <rect width="125" height="30" rx="6" fill="url(#pillFill)" stroke="#0078D4" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#0078D4" />
        <text x="22" y="19" class="sans tool-text">PIM / Entra ID</text>
      </g>
      <!-- Automated Rollbacks -->
      <g transform="translate(280, 0)">
        <rect width="165" height="30" rx="6" fill="url(#pillFill)" stroke="#10B981" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#10B981" />
        <text x="22" y="19" class="sans tool-text">Automated Rollbacks</text>
      </g>
    </g>

    <text x="20" y="148" class="mono" font-size="10" fill="#64748B">
      Zero Secrets in Code • Static + Dynamic Security • Vulnerability Management
    </text>
  </g>

  <!-- CARD 4: AGENTIC AI, LLM & RAG (Bottom Right) -->
  <g transform="translate(615, 250)">
    <rect width="555" height="165" rx="12" fill="url(#toolCardBg)" stroke="#1E293B" stroke-width="1.2" filter="url(#softGlow)" />
    <path d="M 12 0 L 543 0" stroke="url(#accentAI)" stroke-width="2" stroke-linecap="round" />
    <text x="20" y="28" class="sans cat-title" fill="#C084FC">🧠 AGENTIC AI, LLMOps &amp; ENTERPRISE RAG SYSTEMS</text>

    <!-- Pills Row 1 -->
    <g transform="translate(20, 48)">
      <!-- Agentic AI -->
      <g transform="translate(0, 0)">
        <rect width="95" height="30" rx="6" fill="url(#pillFill)" stroke="#EC4899" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#EC4899" />
        <text x="22" y="19" class="sans tool-text">Agentic AI</text>
      </g>
      <!-- LLM -->
      <g transform="translate(105, 0)">
        <rect width="60" height="30" rx="6" fill="url(#pillFill)" stroke="#8B5CF6" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#8B5CF6" />
        <text x="22" y="19" class="sans tool-text">LLM</text>
      </g>
      <!-- RAG -->
      <g transform="translate(175, 0)">
        <rect width="65" height="30" rx="6" fill="url(#pillFill)" stroke="#06B6D4" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#06B6D4" />
        <text x="22" y="19" class="sans tool-text">RAG</text>
      </g>
      <!-- Azure AI Search -->
      <g transform="translate(250, 0)">
        <rect width="135" height="30" rx="6" fill="url(#pillFill)" stroke="#0078D4" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#0078D4" />
        <text x="22" y="19" class="sans tool-text">Azure AI Search</text>
      </g>
      <!-- Azure AI Foundry -->
      <g transform="translate(395, 0)">
        <rect width="140" height="30" rx="6" fill="url(#pillFill)" stroke="#0078D4" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#38BDF8" />
        <text x="22" y="19" class="sans tool-text">Azure AI Foundry</text>
      </g>
    </g>

    <!-- Pills Row 2 -->
    <g transform="translate(20, 92)">
      <!-- Postgres / pgvector -->
      <g transform="translate(0, 0)">
        <rect width="155" height="30" rx="6" fill="url(#pillFill)" stroke="#336791" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#336791" />
        <text x="22" y="19" class="sans tool-text">Postgres (pgvector)</text>
      </g>
      <!-- MCP Protocol -->
      <g transform="translate(165, 0)">
        <rect width="115" height="30" rx="6" fill="url(#pillFill)" stroke="#8B5CF6" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#8B5CF6" />
        <text x="22" y="19" class="sans tool-text">MCP Protocol</text>
      </g>
      <!-- LangGraph & CrewAI -->
      <g transform="translate(290, 0)">
        <rect width="155" height="30" rx="6" fill="url(#pillFill)" stroke="#EC4899" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#EC4899" />
        <text x="22" y="19" class="sans tool-text">LangGraph &amp; CrewAI</text>
      </g>
    </g>

    <text x="20" y="148" class="mono" font-size="10" fill="#64748B">
      Hybrid Vector Search • Autonomous Incident Triage • LLMOps Guardrails
    </text>
  </g>
</svg>
