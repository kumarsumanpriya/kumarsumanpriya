<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Top Borders -->
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" /><stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" /><stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="glow3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" /><stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glow4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" /><stop offset="100%" stop-color="#DB2777" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
    .number { font-weight: 900; font-size: 38px; }
    .label { font-size: 13.5px; font-weight: 700; fill: #F1F5F9; letter-spacing: 0.3px; }
    .sub { font-size: 11.5px; fill: #64748B; font-weight: 500; }
  </style>

  <!-- CARD 1 -->
  <g transform="translate(0, 0)">
    <rect width="285" height="140" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" filter="url(#cardShadow)" />
    <path d="M 14 0 L 271 0" stroke="url(#glow1)" stroke-width="2.5" stroke-linecap="round" />
    <text x="24" y="52" class="sans number" fill="#38BDF8">60%</text>
    <text x="24" y="86" class="sans label">Faster Cloud Provisioning</text>
    <text x="24" y="110" class="mono sub">Automated Reusable Terraform Modules</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(305, 0)">
    <rect width="285" height="140" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" filter="url(#cardShadow)" />
    <path d="M 14 0 L 271 0" stroke="url(#glow2)" stroke-width="2.5" stroke-linecap="round" />
    <text x="24" y="52" class="sans number" fill="#818CF8">40%</text>
    <text x="24" y="86" class="sans label">Cloud Cost Slashed</text>
    <text x="24" y="110" class="mono sub">Infracost &amp; OpenCost Governance</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(610, 0)">
    <rect width="285" height="140" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" filter="url(#cardShadow)" />
    <path d="M 14 0 L 271 0" stroke="url(#glow3)" stroke-width="2.5" stroke-linecap="round" />
    <text x="24" y="52" class="sans number" fill="#34D399">50%</text>
    <text x="24" y="86" class="sans label">Faster Release Velocity</text>
    <text x="24" y="110" class="mono sub">Zero-Downtime GitHub Actions &amp; ADO</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(915, 0)">
    <rect width="285" height="140" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" filter="url(#cardShadow)" />
    <path d="M 14 0 L 271 0" stroke="url(#glow4)" stroke-width="2.5" stroke-linecap="round" />
    <text x="24" y="52" class="sans number" fill="#F472B6">0</text>
    <text x="24" y="86" class="sans label">Secret Leaks &amp; Drift</text>
    <text x="24" y="110" class="mono sub">TruffleHog, Tfsec &amp; Terratest Gates</text>
  </g>
</svg>