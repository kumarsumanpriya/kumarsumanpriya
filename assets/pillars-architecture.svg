<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="pillarsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#060A18" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="pillarCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98" />
    </linearGradient>

    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
    .main-title { font-size: 15px; font-weight: 800; fill: #FFFFFF; letter-spacing: 1.5px; }
    .p-title { font-size: 13.5px; font-weight: 800; letter-spacing: 0.5px; }
    .p-bullet { font-size: 11.5px; fill: #CBD5E1; }
  </style>

  <!-- Container -->
  <rect width="1200" height="320" rx="16" fill="url(#pillarsBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- HEADER -->
  <g transform="translate(30, 20)">
    <rect width="1140" height="46" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <path d="M 12 0 L 1128 0" stroke="url(#headerGrad)" stroke-width="3" stroke-linecap="round" />
    <text x="570" y="29" class="sans main-title" text-anchor="middle">THE 4 CORE PILLARS OF DEVSECOPS &amp; CLOUD PLATFORM ENGINEERING</text>
  </g>

  <!-- 4 SOLID CARDS -->

  <!-- CARD 1 -->
  <g transform="translate(30, 80)">
    <rect width="270" height="215" rx="12" fill="url(#pillarCard)" stroke="#1E293B" stroke-width="1.2" filter="url(#pShadow)" />
    <path d="M 10 0 L 260 0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <text x="18" y="30" class="sans p-title" fill="#38BDF8">1. CLOUD IAC &amp; MODULES</text>
    <text x="18" y="48" class="mono" font-size="10" fill="#64748B">TERRAFORM &amp; AZURE</text>
    <line x1="18" y1="58" x2="252" y2="58" stroke="#334155" stroke-width="0.8" />

    <circle cx="26" cy="80" r="3" fill="#38BDF8" />
    <text x="36" y="84" class="sans p-bullet">Reusable Modules (VNet, AKS, KV)</text>

    <circle cx="26" cy="110" r="3" fill="#38BDF8" />
    <text x="36" y="114" class="sans p-bullet">Azure Landing Zones (Dev / QA)</text>

    <circle cx="26" cy="140" r="3" fill="#38BDF8" />
    <text x="36" y="144" class="sans p-bullet">Terratest Automated Validation</text>

    <circle cx="26" cy="170" r="3" fill="#38BDF8" />
    <text x="36" y="174" class="sans p-bullet">60% Faster Provisioning Cycles</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(320, 80)">
    <rect width="270" height="215" rx="12" fill="url(#pillarCard)" stroke="#1E293B" stroke-width="1.2" filter="url(#pShadow)" />
    <path d="M 10 0 L 260 0" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
    <text x="18" y="30" class="sans p-title" fill="#34D399">2. SHIFT-LEFT SECURITY</text>
    <text x="18" y="48" class="mono" font-size="10" fill="#64748B">ZERO-TRUST PIPELINES</text>
    <line x1="18" y1="58" x2="252" y2="58" stroke="#334155" stroke-width="0.8" />

    <circle cx="26" cy="80" r="3" fill="#34D399" />
    <text x="36" y="84" class="sans p-bullet">Tfsec &amp; TFLint Quality Gates</text>

    <circle cx="26" cy="110" r="3" fill="#34D399" />
    <text x="36" y="114" class="sans p-bullet">TruffleHog &amp; Gitleaks Secrets Scan</text>

    <circle cx="26" cy="140" r="3" fill="#34D399" />
    <text x="36" y="144" class="sans p-bullet">Checkov, SonarQube &amp; SuperLinter</text>

    <circle cx="26" cy="170" r="3" fill="#34D399" />
    <text x="36" y="174" class="sans p-bullet">Zero Secret Leaks Enforced</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(610, 80)">
    <rect width="270" height="215" rx="12" fill="url(#pillarCard)" stroke="#1E293B" stroke-width="1.2" filter="url(#pShadow)" />
    <path d="M 10 0 L 260 0" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" />
    <text x="18" y="30" class="sans p-title" fill="#818CF8">3. CI/CD &amp; AGENTIC AI</text>
    <text x="18" y="48" class="mono" font-size="10" fill="#64748B">GITHUB ACTIONS &amp; ADO</text>
    <line x1="18" y1="58" x2="252" y2="58" stroke="#334155" stroke-width="0.8" />

    <circle cx="26" cy="80" r="3" fill="#818CF8" />
    <text x="36" y="84" class="sans p-bullet">Multi-Stage GitHub Actions &amp; ADO</text>

    <circle cx="26" cy="110" r="3" fill="#818CF8" />
    <text x="36" y="114" class="sans p-bullet">Intelligent Terraform AI Agents</text>

    <circle cx="26" cy="140" r="3" fill="#818CF8" />
    <text x="36" y="144" class="sans p-bullet">Automated IaC Drift Detection</text>

    <circle cx="26" cy="170" r="3" fill="#818CF8" />
    <text x="36" y="174" class="sans p-bullet">50% Release Cycle Acceleration</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(900, 80)">
    <rect width="270" height="215" rx="12" fill="url(#pillarCard)" stroke="#1E293B" stroke-width="1.2" filter="url(#pShadow)" />
    <path d="M 10 0 L 260 0" stroke="#F472B6" stroke-width="2.5" stroke-linecap="round" />
    <text x="18" y="30" class="sans p-title" fill="#F472B6">4. FINOPS &amp; AUTOMATION</text>
    <text x="18" y="48" class="mono" font-size="10" fill="#64748B">INFRACOST &amp; OPENCOST</text>
    <line x1="18" y1="58" x2="252" y2="58" stroke="#334155" stroke-width="0.8" />

    <circle cx="26" cy="80" r="3" fill="#F472B6" />
    <text x="36" y="84" class="sans p-bullet">40% Cloud Spend Reduction</text>

    <circle cx="26" cy="110" r="3" fill="#F472B6" />
    <text x="36" y="114" class="sans p-bullet">Infracost PR Budget Dashboards</text>

    <circle cx="26" cy="140" r="3" fill="#F472B6" />
    <text x="36" y="144" class="sans p-bullet">OpenCost Product Spend Attribution</text>

    <circle cx="26" cy="170" r="3" fill="#F472B6" />
    <text x="36" y="174" class="sans p-bullet">Python &amp; PowerShell Automation</text>
  </g>
</svg>